<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9F7" />
      <stop offset="100%" stop-color="#E9EFEA" />
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#405043" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bgGrad2)" />
  
  <!-- Architectural Room Lines -->
  <line x1="160" y1="560" x2="1080" y2="560" stroke="#D3DED4" stroke-width="2" />
  <circle cx="880" cy="340" r="220" fill="#DFE8E0" opacity="0.6" />
  
  <!-- Modern Litter Station Illustration -->
  <rect x="740" y="460" width="280" height="100" rx="14" fill="#C8D4C9" stroke="#9EABA0" stroke-width="2" />
  <rect x="760" y="475" width="240" height="60" rx="8" fill="#E8EFE9" />
  <!-- Scoop outline -->
  <line x1="1040" y1="420" x2="1070" y2="480" stroke="#7A8B7C" stroke-width="4" stroke-linecap="round" />
  <rect x="1055" y="475" width="30" height="40" rx="4" fill="#7A8B7C" transform="rotate(15 1055 475)" />

  <!-- Editorial Card Block -->
  <g filter="url(#softShadow2)">
    <rect x="220" y="240" width="520" height="340" rx="20" fill="#FFFFFF" />
    <rect x="260" y="280" width="140" height="30" rx="6" fill="#EBF1EC" />
    <text x="330" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#3F5243" text-anchor="middle" letter-spacing="1.5">LITTER BOX CARE</text>
    
    <text x="260" y="360" font-family="'Playfair Display', serif" font-size="34" font-weight="600" fill="#252422" letter-spacing="-0.5">How to Clean a Cat</text>
    <text x="260" y="405" font-family="'Playfair Display', serif" font-size="34" font-weight="600" fill="#252422" letter-spacing="-0.5">Litter Box Properly</text>
    
    <text x="260" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#6B655B">A calm daily scooping and monthly deep-clean</text>
    <text x="260" y="485" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#6B655B">routine that eliminates lingering box odors.</text>
    
    <line x1="260" y1="525" x2="680" y2="525" stroke="#F0EBE1" stroke-width="1.5" />
    <circle cx="275" cy="548" r="4" fill="#5A705E" />
    <text x="290" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#4A453E">Clean Cat Home Editorial Guide • 7 Min Read</text>
  </g>
</svg>
